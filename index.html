<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LRSW99 Pseudonym System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.css">
<main id="demo"><p>Loading the LRSW99 demo…</p></main>
<noscript>Enable JavaScript to run this Python demo in your browser.</noscript>
<script type="module">
  const root = document.getElementById("demo");
  try {
    const { mount } = await import("https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.js");
    const files = {"app.py": {"url": "./app.py"}, "src/__init__.py": {"url": "./src/__init__.py"}, "src/actors.py": {"url": "./src/actors.py"}, "src/attacks.py": {"url": "./src/attacks.py"}, "src/campus.py": {"url": "./src/campus.py"}, "src/chaum_pedersen.py": {"url": "./src/chaum_pedersen.py"}, "src/credentials.py": {"url": "./src/credentials.py"}, "src/gamma.py": {"url": "./src/gamma.py"}, "src/group.py": {"url": "./src/group.py"}, "src/pseudonym.py": {"url": "./src/pseudonym.py"}};
    for (const file of Object.values(files)) {
      file.url = new URL(file.url, document.baseURI).href;
    }
    await mount({ entrypoint: "app.py", files }, root);
  } catch (error) {
    root.textContent = "The demo could not load. Refresh to try again.";
    console.error(error);
  }
</script>
</html>
